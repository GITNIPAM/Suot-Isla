<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orders &amp; Island Club — Suot Isla</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-stamp.svg?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/base.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/storefront.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/admin.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/live-shop.css?v=37679de-r7" />
</head>
<body>
  <div id="site-header-mount"></div>
  <main>
    <section class="catalog-hero" aria-label="Suot Isla Island Club Orders Header">
      <img
        src="assets/images/hero-elnido.jpg"
        alt="Crystal turquoise waters of El Nido lagoon at dawn"
        class="catalog-hero-bg"
      />
      <div class="catalog-hero-scrim" aria-hidden="true"></div>

      <div class="container catalog-hero-content">
        <div class="catalog-hero-top">
          <div>
            <span class="catalog-hero-eyebrow">
              SUOT ISLA ISLAND CLUB • MEMBER DISPATCH PORTAL
            </span>
            <h1 class="catalog-hero-title">
              Island Orders &amp; <em id="acct-hero-name">Dispatches.</em>
            </h1>
            <div class="account-hero-meta" id="acct-user-meta"></div>
          </div>

          <div class="account-hero-actions" hidden>
            <button type="button" class="account-hero-btn" id="acct-open-emails-btn">
              Order Emails
            </button>
            <button type="button" class="account-hero-btn" id="acct-signout-btn">Sign Out</button>
            <a href="catalog.html" class="btn btn-coral btn-sm btn-pill">Shop the collection</a>
          </div>
        </div>

        <nav class="catalog-hero-dock" id="account-workspace-tabs" aria-label="Account sections" hidden></nav>
      </div>
    </section>
    <section class="container account-workspace live-main"><p class="live-status" data-shop-status role="status"></p><div data-shop-page="account" aria-busy="true"><p>Loading…</p></div></section>
  </main>
  <div id="site-footer-mount"></div>
  <script src="assets/js/data.js?v=37679de-r1"></script>
  <script src="assets/js/store.js?v=37679de-r1"></script>
  <script src="assets/js/components.js?v=37679de-r7"></script>
  <script src="assets/js/ocean-overdrive.js?v=37679de-r1"></script>
  <script src="assets/js/live-shop.js?v=37679de-r7"></script>
</body>
</html>
