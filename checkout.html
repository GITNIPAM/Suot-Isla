<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout &amp; Validation — Suot Isla</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-stamp.svg?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/base.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/storefront.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/live-shop.css?v=37679de-r4" />
</head>
<body>
  <div id="site-header-mount"></div>
  <main>
<div class="container live-main">
    <div style="padding-top:var(--space-8);padding-bottom:var(--space-4);border-bottom:1px solid var(--border-subtle);">
      <h1 id="checkout-head-title" style="font-size:var(--text-3xl);margin-bottom:var(--space-2);">Island Checkout &amp; Dispatch</h1>
      <p id="checkout-head-desc">Enter your delivery details and choose GCash or Cash on Delivery.</p>
    </div><p class="live-status" data-shop-status role="status"></p><div id="checkout-mount" data-shop-page="checkout" aria-busy="true"><p>Loading…</p></div></div>
  <template id="checkout-layout"><form id="checkout-form" data-action="checkout" action="api/checkout.php" method="POST" class="surface-card">
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--space-2);margin-bottom:var(--space-4);">
          <h2 style="margin:0;font-size:var(--text-xl);">1. Customer Billing Details</h2>
          <span class="pill pill-delivery">✓ Stock &amp; Session Verified</span>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="chk-fullname">Full Name *</label>
            <input type="text" id="chk-fullname" name="full_name" class="form-input" required placeholder="e.g. Bianca Dela Cruz" />
          </div>
          <div class="form-group">
            <label class="form-label" for="chk-email">Confirmation Email Address *</label>
            <input type="email" id="chk-email" name="email" readonly class="form-input" required placeholder="you@suotisla.ph" />
            <span class="form-hint">Order confirmation &amp; shipping emails will be sent here.</span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="chk-phone">Mobile Number (Courier SMS) *</label>
            <input
              type="tel"
              id="chk-phone"
              name="phone"
              class="form-input tabular"
              required
              maxlength="11"
              minlength="11"
              inputmode="numeric"
              pattern="09[0-9]{9}"
              placeholder="09171234567"
            />
            <span class="phone-digit-hint" id="chk-phone-hint">11 digits · PH format 09XXXXXXXXX</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="chk-preset-addr">Your Saved Philippine Addresses</label>
            <select id="chk-preset-addr" class="form-select"></select>
          </div>
        </div>

        <h2 style="font-size:var(--text-xl);margin-top:var(--space-6);margin-bottom:var(--space-3);">
          2. Shipping Address &amp; Validation
        </h2>

        <div class="form-group">
          <label class="form-label" for="chk-street">House / Unit No., Street Name *</label>
          <input type="text" id="chk-street" name="street_address" class="form-input" required placeholder="House / Unit No., Street or Highway" />
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="chk-barangay">Barangay *</label>
            <input type="text" id="chk-barangay" name="barangay" class="form-input" required placeholder="e.g. San Lorenzo" />
          </div>
          <div class="form-group">
            <label class="form-label" for="chk-city">City / Municipality *</label>
            <input type="text" id="chk-city" name="city" class="form-input" required placeholder="e.g. Makati City" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="chk-province">Province / Island Region *</label>
            <input type="text" id="chk-province" name="province" class="form-input" required placeholder="e.g. Metro Manila" />
          </div>
          <div class="form-group">
            <label class="form-label" for="chk-postal">Postal / ZIP Code (4 Digits) *</label>
            <input type="text" id="chk-postal" name="postal_code" class="form-input mono" pattern="[0-9]{4}" maxlength="4" inputmode="numeric" required placeholder="1223" />
          </div>
        </div>

        <label class="form-label">Billing address if different from shipping<input name="billing_address" class="form-input" maxlength="500"></label>
        <h2 style="font-size:var(--text-xl);margin-top:var(--space-6);margin-bottom:var(--space-3);">
          3. Payment Method &amp; Confirmation
        </h2>

        <input type="hidden" name="payment_method" id="chk-payment-method" value="GCash" />

        <div class="payment-method-grid" id="payment-options-grid">
          <button type="button" class="payment-option active" data-pay-method="GCash">
            <span class="pill pill-lagoon">GCash</span>
            <span>GCash Express Wallet</span>
          </button>
          <button type="button" class="payment-option" data-pay-method="COD">
            <span class="pill pill-coral">COD</span>
            <span>Cash on Delivery</span>
          </button>
        </div>

        <div id="payment-details-box" style="background:var(--color-sand);padding:var(--space-4);border-radius:var(--radius-sm);margin-bottom:var(--space-6);">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label" for="chk-pay-account" id="chk-pay-account-label">GCash Express Mobile Number *</label>
            <input type="tel" id="chk-pay-account" name="payer_mobile" pattern="09[0-9]{9}" class="form-input mono tabular" maxlength="11" inputmode="numeric" required placeholder="09171234567" />
            <span class="phone-digit-hint" id="chk-pay-account-hint">11 digits · Mock GCash payment for this class project.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block" id="checkout-submit-btn">
          Place order →
        </button>
      </form></template>
  </main>
  <div id="site-footer-mount"></div>
  <dialog id="checkout-payment-modal" class="gcash-pay-modal-card" aria-labelledby="chk-pay-modal-title">
      <div class="gcash-pay-banner" id="chk-pay-modal-banner">
        <div>
          <div class="mono" style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;opacity:0.85;" id="chk-pay-modal-eyebrow">GCash Express Authorization</div>
          <h3 id="chk-pay-modal-title" style="margin:2px 0 0;color:#fff;font-size:var(--text-xl);">Confirm Payment</h3>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="chk-pay-modal-close" style="color:#fff;border-color:rgba(255,255,255,0.28);" aria-label="Close payment modal">✕</button>
      </div>
      <div id="chk-pay-modal-body" style="padding:var(--space-5);"></div>
  </dialog>
  <script src="assets/js/data.js?v=37679de-r1"></script>
  <script src="assets/js/store.js?v=37679de-r1"></script>
  <script src="assets/js/components.js?v=37679de-r4"></script>
  <script src="assets/js/ocean-overdrive.js?v=37679de-r1"></script>
  <script src="assets/js/live-shop.js?v=37679de-r4"></script>
</body>
</html>
