<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Island Club Sign In — Suot Isla</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-stamp.svg?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=37679de-r1" />
  <link rel="stylesheet" href="assets/css/base.css?v=ea9cbdb-r1" />
  <link rel="stylesheet" href="assets/css/storefront.css?v=ea9cbdb-r1" />
  <link rel="stylesheet" href="assets/css/account-auth.css?v=37679de-r1" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="container">
    <div id="auth-redirect-notice" style="display:none;max-width:960px;margin:var(--space-5) auto 0;padding:0.85rem 1.1rem;border-radius:12px;background:rgba(14,107,116,0.09);border:1px solid rgba(14,107,116,0.28);color:var(--color-lagoon-ink);font-size:var(--text-sm);font-weight:600;"></div>
    <div class="auth-showcase-wrap">
      <!-- Left Editorial Island Visual -->
      <div class="auth-editorial-frame">
        <img
          src="assets/images/auth-editorial-flatlay.jpg?v=37679de-r1"
          alt="Sunlit coastal flat-lay featuring Suot Isla lagoon teal boardshorts, warm sand linen shirt, woven buri tote, seafoam waffle towel, and seashells"
          loading="eager"
        />
      </div>

      <!-- Focused Sign In / Create Account Card -->
      <section class="auth-card-shell" aria-label="Customer Sign In and Registration">
        <div id="auth-session" class="auth-signedin-bar" hidden>
          <p id="active-session-box"></p>
          <a id="account-continue" class="btn btn-primary btn-sm" href="account.html">Continue</a>
          <button id="account-sign-out" class="btn btn-outline btn-sm" type="button">Sign out</button>
        </div>

        <!-- Sign In Form -->
        <form id="login-form" class="auth-form-stage" action="api/auth-login.php" method="POST">
          <h1 class="auth-card-title">SIGN IN</h1>
          <p class="auth-card-sub">
            Sign in to check out and see your orders.
          </p>

          <div class="form-group">
            <label class="form-label" for="login-email">Email</label>
            <input type="email" id="login-email" name="email" class="form-input" required autocomplete="email" placeholder="you@suotisla.ph" />
          </div>

          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <div class="auth-pass-wrap">
              <input type="password" id="login-password" name="password" class="form-input" required autocomplete="current-password" placeholder="Enter your password" />
              <button type="button" class="auth-pass-toggle" data-toggle-pass="login-password" aria-label="Show password">Show</button>
            </div>
          </div>

          <div id="login-auth-alert" role="alert" style="display:none;margin-bottom:var(--space-4);padding:0.65rem 0.85rem;border-radius:var(--radius-sm);background:var(--color-coral-surface);border:1px solid rgba(242,125,99,0.55);color:var(--color-coral-deep);font-size:0.8rem;font-weight:600;"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Sign in
          </button>

          <p class="auth-switch-copy">
            New here?
            <button type="button" class="auth-inline-link" id="switch-to-register-btn">Create an account</button>
          </p>
        </form>

        <!-- Create Customer Account Form -->
        <form id="register-form" class="auth-form-stage" action="api/auth-register.php" method="POST" style="display:none;">
          <h1 class="auth-card-title">CREATE ACCOUNT</h1>
          <p class="auth-card-sub">
            Save Philippine delivery ports and track your island orders.
          </p>

          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" id="reg-name" name="full_name" class="form-input" required autocomplete="name" placeholder="e.g. Bianca Dela Cruz" />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="reg-email">Email</label>
              <input type="email" id="reg-email" name="email" class="form-input" required autocomplete="email" placeholder="bianca@suotisla.ph" />
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-phone">Mobile Number</label>
              <input
                type="tel"
                id="reg-phone"
                name="phone"
                class="form-input tabular"
                required
                maxlength="11"
                minlength="11"
                inputmode="numeric"
                pattern="09[0-9]{9}"
                autocomplete="tel-national"
                placeholder="09171234567"
              />
              <span class="phone-digit-hint" id="reg-phone-hint">11 digits · PH format 09XXXXXXXXX</span>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-password">Password (min. 8 characters)</label>
            <div class="auth-pass-wrap">
              <input type="password" id="reg-password" name="password" class="form-input" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters" />
              <button type="button" class="auth-pass-toggle" data-toggle-pass="reg-password" aria-label="Show password">Show</button>
            </div>
            <span class="form-hint" id="reg-pass-hint">Enter at least 8 characters.</span>
          </div>

          <div id="register-auth-alert" role="alert" style="display:none;margin-bottom:var(--space-4);padding:0.65rem 0.85rem;border-radius:var(--radius-sm);background:var(--color-coral-surface);border:1px solid rgba(242,125,99,0.55);color:var(--color-coral-deep);font-size:0.8rem;font-weight:600;"></div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">
            Create account
          </button>

          <p class="auth-switch-copy">
            Already have an account?
            <button type="button" class="auth-inline-link" id="switch-to-login-btn">Sign in</button>
          </p>
        </form>

        <p id="account-message" role="status"></p>

        <p class="auth-switch-copy" style="margin-top:var(--space-3);font-size:0.76rem;color:var(--text-muted);">
          Store team, courier, or admin?
          <a href="admin.html" class="auth-inline-link">Operator Sign In →</a>
        </p>
      </section>
    </div>
  </main>

  <div id="site-footer-mount"></div>

  <script src="assets/js/data.js?v=37679de-r1"></script>
  <script src="assets/js/store.js?v=ea9cbdb-r1"></script>
  <script src="assets/js/components.js?v=37679de-r7"></script>
  <script src="assets/js/ocean-overdrive.js?v=37679de-r1"></script>
  <script src="assets/js/account-auth.js?v=37679de-r1"></script>
</body>
</html>
