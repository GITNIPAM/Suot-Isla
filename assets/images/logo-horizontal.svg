<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88" fill="none" role="img" aria-label="Suot Isla — Island-Born Surf &amp; Beachwear">
  <!-- Circular Stamp Badge -->
  <g transform="translate(4, 4)">
    <circle cx="40" cy="40" r="37" fill="#F4EAD5" stroke="#0E6B74" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="32.5" stroke="#0E6B74" stroke-width="1.5" stroke-dasharray="4 3" stroke-linecap="round"/>
    <circle cx="40" cy="40" r="25" fill="#FAF6EE" stroke="#0E6B74" stroke-width="1.5"/>
    <!-- Rising Sun Arc -->
    <path d="M26 42 A14 14 0 0 1 54 42" fill="#F27D63" fill-opacity="0.25" stroke="#F27D63" stroke-width="2" stroke-linecap="round"/>
    <!-- Curling Ocean Wave -->
    <path d="M17 45 C24 40, 32 40, 39 45 C44 48, 52 47, 57 41 C54 36, 47 36, 44 40" stroke="#0E6B74" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 51 C28 47, 37 48, 45 51 C51 53, 57 51, 62 48" stroke="#2E5A44" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="98" y="45" fill="#092C30" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28" letter-spacing="1.5">SUOT ISLA</text>
  <text x="99" y="66" fill="#0E6B74" font-family="'DM Sans', sans-serif" font-weight="600" font-size="11.5" letter-spacing="2.2">ISLAND-BORN SURF &amp; BEACHWEAR</text>
</svg>
