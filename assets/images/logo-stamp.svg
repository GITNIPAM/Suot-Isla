<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="Suot Isla Stamp Logo">
  <!-- Outer Solid Ring -->
  <circle cx="80" cy="80" r="74" fill="#F4EAD5" stroke="#0E6B74" stroke-width="3"/>
  <!-- Subtle Woven Stitch Border -->
  <circle cx="80" cy="80" r="66" stroke="#0E6B74" stroke-width="1.75" stroke-dasharray="6 4" stroke-linecap="round"/>
  <!-- Inner Horizon Circle -->
  <circle cx="80" cy="80" r="52" fill="#FAF6EE" stroke="#0E6B74" stroke-width="1.75"/>
  
  <!-- Clean Line-Art Rising Sun Disc (Smooth Horizon Arc) -->
  <path d="M54 84 A26 26 0 0 1 106 84" fill="#F27D63" fill-opacity="0.22" stroke="#F27D63" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M62 84 A18 18 0 0 1 98 84" stroke="#F27D63" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Curling Ocean Wave -->
  <path d="M32 88 C46 80, 62 80, 76 88 C86 94, 102 92, 112 82 C106 73, 93 73, 88 80 C85 84, 89 88, 94 86" stroke="#0E6B74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M36 99 C52 91, 70 93, 86 100 C98 105, 112 102, 124 94" stroke="#0E6B74" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M46 110 C62 105, 82 106, 98 111 C106 113, 112 111, 116 108" stroke="#2E5A44" stroke-width="2" stroke-linecap="round"/>

  <!-- Stamp Badge Text Markers -->
  <circle cx="24" cy="80" r="2.5" fill="#F27D63"/>
  <circle cx="136" cy="80" r="2.5" fill="#F27D63"/>
</svg>
