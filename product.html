<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details — Suot Isla</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/logo-stamp.svg?v=78" />
  <link rel="stylesheet" href="assets/css/tokens.css?v=78" />
  <link rel="stylesheet" href="assets/css/base.css?v=78" />
  <link rel="stylesheet" href="assets/css/storefront.css?v=78" />
</head>
<body>
  <div id="site-header-mount"></div>

  <main class="container">
    <nav class="pdp-breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <span aria-hidden="true">/</span>
      <a href="catalog.html">Catalog</a>
      <span aria-hidden="true">/</span>
      <a id="pdp-breadcrumb-series" href="catalog.html">Series</a>
      <span aria-hidden="true">/</span>
      <span id="pdp-breadcrumb-name" class="pdp-breadcrumb-current">Product Details</span>
    </nav>

    <section class="pdp-grid" id="pdp-mount"></section>

    <div id="pdp-series-band-mount"></div>

    <section class="section-block" style="border-top:1px solid var(--border-subtle);">
      <div class="section-head">
        <div>
          <h2>Complete Your Island Kit</h2>
          <p>Companion essentials curated to pair with this piece.</p>
        </div>
        <a id="pdp-series-all-link" href="catalog.html" class="btn btn-outline btn-sm">View Full Catalog</a>
      </div>
      <div class="product-grid pdp-related-grid" id="pdp-related-grid"></div>
    </section>
  </main>

  <div id="site-footer-mount"></div>

  <script src="assets/js/data.js?v=78"></script>
  <script src="assets/js/store.js?v=78"></script>
  <script src="assets/js/components.js?v=78"></script>
  <script src="assets/js/ocean-overdrive.js?v=78"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const pid = params.get("id") || "siargao-cloud9-boardshorts";
      let product = window.SuotStore.getProductById(pid);
      const paramColor = params.get("color");

      let chosenColor =
        paramColor && product.colors && product.colors.includes(paramColor)
          ? paramColor
          : product.colors[0];
      let chosenSize = product.sizes[0];
      let chosenQty = 1;
      let isZoomed = false;
      let sizeGuideOpen = false;
      const openAccordions = new Set(["material"]);

      const breadcrumbEl = document.getElementById("pdp-breadcrumb-name");
      const breadcrumbSeriesEl = document.getElementById("pdp-breadcrumb-series");
      const seriesBandMount = document.getElementById("pdp-series-band-mount");
      const seriesAllLink = document.getElementById("pdp-series-all-link");
      const mountEl = document.getElementById("pdp-mount");
      const relatedEl = document.getElementById("pdp-related-grid");

      const seriesMeta = (window.SUOT_ISLA_DATA.islandSeries || []).find(
        (s) => s.id === product.series
      );

      document.title = `${product.name} — Suot Isla`;
      breadcrumbEl.textContent = product.name;
      if (breadcrumbSeriesEl) {
        breadcrumbSeriesEl.textContent = `${product.series} Series`;
        breadcrumbSeriesEl.href = `catalog.html?series=${encodeURIComponent(product.series)}`;
      }
      if (seriesAllLink) {
        seriesAllLink.href = `catalog.html?series=${encodeURIComponent(product.series)}`;
        seriesAllLink.textContent = `Shop All ${product.series} Pieces →`;
      }

      function getSizeGuideData(prod) {
        const sil = prod.silhouette || "shirt";
        if (sil === "shorts") {
          return {
            title: "Philippine Coastal Short Sizing (Flat Measurements)",
            headers: ["Size", "Waist (in / cm)", "Outseam", "Hem Opening"],
            rows: [
              ["28 / S", "28–29\" (71–74 cm)", "17.5\"", "22.5\""],
              ["30 / M", "30–31\" (76–79 cm)", "18.0\"", "23.2\""],
              ["32 / L", "32–33\" (81–84 cm)", "18.5\"", "24.0\""],
              ["34 / XL", "34–35\" (86–89 cm)", "19.0\"", "24.8\""],
              ["36", "36–37\" (91–94 cm)", "19.5\"", "25.5\""]
            ].filter((r) =>
              prod.sizes.some((sz) => r[0].startsWith(sz) || r[0].endsWith(sz))
            ),
            note: "Tailored above-knee surf cut. Choose your exact waist size or size up for a looser boardwalk fit."
          };
        }
        if (sil === "trousers") {
          return {
            title: "Relaxed Resort Trouser Fit (Inches / cm)",
            headers: ["Size", "Relaxed Waist", "Hip", "Inseam"],
            rows: [
              ["S", "28–30\" (71–76 cm)", "40\"", "28.5\""],
              ["M", "31–33\" (79–84 cm)", "42\"", "29.0\""],
              ["L", "34–36\" (86–91 cm)", "44\"", "29.5\""],
              ["XL", "37–39\" (94–99 cm)", "46\"", "30.0\""]
            ],
            note: "Elasticated drawstring waist with roomy straight-leg drape built for tropical airflow."
          };
        }
        if (sil === "surfsuit" || sil === "rashguard") {
          return {
            title: "UPF 50+ Performance Swim Fit (cm)",
            headers: ["Size", "Chest", "Waist", "Sleeve (Center Back)"],
            rows: [
              ["XS", "80–85 cm", "62–67 cm", "76 cm"],
              ["S", "86–91 cm", "68–73 cm", "78 cm"],
              ["M", "92–97 cm", "74–79 cm", "80 cm"],
              ["L", "98–104 cm", "80–86 cm", "82 cm"],
              ["XL", "105–111 cm", "87–93 cm", "84 cm"]
            ].filter((r) => prod.sizes.includes(r[0])),
            note: "Second-skin compression fit prevents water drag and rash in overhead surf. Size up if between sizes."
          };
        }
        if (sil === "poncho") {
          return {
            title: "Changing Poncho Coverage Specs",
            headers: ["Spec", "Length (Shoulder–Hem)", "Body Width", "Recommended Height"],
            rows: [
              ["Standard", "104 cm (41\")", "82 cm", "5'1\" – 5'9\""],
              ["Tall", "114 cm (45\")", "86 cm", "5'10\" and above"]
            ],
            note: "Side snap plackets unsnap cleanly for effortless parking-lot or shoreline wetsuit changes."
          };
        }
        if (sil === "drybag" || sil === "tote" || sil === "towel" || sil === "throw" || sil === "cap" || sil === "sarong") {
          const map = {
            drybag: {
              title: "15L Roll-Top Gear Volume",
              headers: ["Spec", "Rolled Dimensions", "Capacity Guide"],
              rows: [["15L", "52 cm × 24 cm dia.", "2 towels, phone pouch, sunscreen & camera"]]
            },
            tote: {
              title: "Handwoven Buri Tote Dimensions",
              headers: ["Size", "Width × Height × Gusset", "Handle Drop"],
              rows: [
                ["Medium", "38 × 32 × 14 cm", "24 cm shoulder carry"],
                ["Large", "44 × 37 × 17 cm", "26 cm shoulder carry"]
              ]
            },
            towel: {
              title: "Honeycomb Waffle Towel Dimensions",
              headers: ["Size", "Unfolded Dimensions", "Packed Roll"],
              rows: [
                ["Medium", "140 × 70 cm", "18 × 9 cm (240 g)"],
                ["Large", "175 × 90 cm", "21 × 11 cm (320 g)"]
              ]
            },
            throw: {
              title: "Round Coastal Mat Dimensions",
              headers: ["Spec", "Full Diameter", "Weight"],
              rows: [["150cm Diameter", "150 cm circle + 6 cm cotton fringe", "780 g (420 GSM)"]]
            },
            cap: {
              title: "5-Panel Adjustable Fit",
              headers: ["Spec", "Head Circumference", "Brim Length"],
              rows: [["One Size", "54–61 cm (brass slider)", "7.0 cm curved peak"]]
            },
            sarong: {
              title: "Hand-Dyed Sarong Drape Width",
              headers: ["Size", "Wrap Width × Drop", "Best For"],
              rows: [
                ["Free Size", "175 × 110 cm", "Waist XS–L multi-tie wrap"],
                ["Plus Size", "205 × 115 cm", "Full dress tie & XL+ wrap"]
              ]
            }
          };
          return {
            ...map[sil],
            note: "Individually measured by our General Luna & Manila studio team."
          };
        }
        return {
          title: "Philippine Resort Top Fit (Measured Flat, cm)",
          headers: ["Size", "Half-Chest", "Shoulder", "Body Length"],
          rows: [
            ["S", "53 cm", "46 cm", "69 cm"],
            ["M", "56 cm", "48 cm", "71.5 cm"],
            ["L", "59 cm", "50 cm", "74 cm"],
            ["XL", "62 cm", "52 cm", "76.5 cm"]
          ],
          note: "Relaxed Philippine coastal block with generous shoulder drop. Take your usual size for an effortless breeze fit."
        };
      }

      function syncColorUrl(color) {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("id", product.id);
        nextUrl.searchParams.set("color", color);
        window.history.replaceState({}, "", nextUrl.toString());
      }

      function getShippingMeta(subtotal) {
        const threshold = 3500;
        const pct = Math.min(100, Math.round((subtotal / threshold) * 100));
        const remaining = Math.max(0, threshold - subtotal);
        return {
          isFree: remaining === 0,
          pct,
          text:
            remaining === 0
              ? "Unlocked: Free Philippine Island Express Shipping"
              : `Add ${window.SuotStore.formatPrice(remaining)} more for Free Island Express Shipping (₱3,500+)`
        };
      }

      function renderPDP() {
        product = window.SuotStore.getProductById(product.id) || product;
        const availStock = Math.max(0, parseInt(product.stock, 10) || 0);
        const inBagQty = window.SuotStore.getCartQtyForProduct(product.id);
        const remainingAddable = Math.max(0, availStock - inBagQty);
        const isOutOfStock = availStock <= 0;
        const isLowStock = availStock > 0 && availStock <= 5;
        if (remainingAddable > 0 && chosenQty > remainingAddable) {
          chosenQty = remainingAddable;
        } else if (remainingAddable <= 0) {
          chosenQty = 1;
        }

        const lineSubtotal = product.price * chosenQty;
        const shipMeta = getShippingMeta(lineSubtotal);
        const guide = getSizeGuideData(product);
        const similarInStock = window.SuotStore.findSimilarInStockProducts(product, 3);

        mountEl.innerHTML = `
          <div class="pdp-gallery-col">
            <div class="pdp-stage ${isZoomed ? "is-zoomed" : ""}" id="pdp-stage" aria-label="Product studio photograph — click to zoom">
              <div class="pdp-stage-overlay-top">
                <div class="pdp-stage-badges">
                  <span class="pill pill-lagoon">${product.series} Series</span>
                  ${
                    isOutOfStock
                      ? `<span class="pill pill-coral">Sold Out</span>`
                      : isLowStock
                      ? `<span class="pill pill-coral">Low Stock: Only ${availStock} left</span>`
                      : `<span class="pill pill-delivery">In Stock (${availStock} units)</span>`
                  }
                </div>
                <div class="pdp-stage-tools">
                  <button type="button" class="pdp-tool-btn" id="pdp-zoom-toggle" title="${isZoomed ? "Exit Zoom" : "Inspect Fabric"}">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <circle cx="11" cy="11" r="7"></circle>
                      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                      ${isZoomed ? `<line x1="8" y1="11" x2="14" y2="11"></line>` : `<line x1="11" y1="8" x2="11" y2="14"></line><line x1="8" y1="11" x2="14" y2="11"></line>`}
                    </svg>
                    <span>${isZoomed ? "Reset" : "Inspect"}</span>
                  </button>
                  <button type="button" class="pdp-tool-btn" id="pdp-share-btn" title="Copy direct link to this colorway">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                      <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                      <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg>
                    <span>Share</span>
                  </button>
                </div>
              </div>

              ${window.SuotStore.renderProductVisual(product, chosenColor)}

              <div class="pdp-stage-caption">
                <span>${chosenColor}</span>
                <span aria-hidden="true">·</span>
                <span>Size ${chosenSize}</span>
                <span aria-hidden="true">·</span>
                <span>${isZoomed ? "Move pointer to inspect weave" : "Click to zoom"}</span>
              </div>
            </div>

            <div class="pdp-thumb-strip" role="group" aria-label="Colorway Photo Previews">
              ${product.colors
                .map((c) => {
                  const thumbSrc = window.SuotStore.getProductImageForColor(product, c);
                  return `
                    <button
                      type="button"
                      class="pdp-thumb-item ${c === chosenColor ? "active" : ""}"
                      data-pdp-color="${c}"
                      aria-pressed="${c === chosenColor ? "true" : "false"}"
                    >
                      <span class="pdp-thumb-frame">
                        <img src="${thumbSrc}" alt="${product.name} in ${c}" loading="lazy" />
                      </span>
                      <span class="pdp-thumb-label">${c}</span>
                    </button>
                  `;
                })
                .join("")}
            </div>
          </div>

          <div class="pdp-info">
            <h1>${product.name}</h1>

            <div class="pdp-meta-row">
              <a href="catalog.html?series=${encodeURIComponent(product.series)}" class="pdp-meta-series">
                ${product.series} Island Series
              </a>
              <span class="pdp-meta-dot" aria-hidden="true"></span>
              <span class="pill pill-sand">${product.category}</span>
              <span class="pdp-meta-dot" aria-hidden="true"></span>
              <span class="mono" style="color:var(--text-muted);">SKU: ${product.sku}</span>
              <span class="pdp-meta-dot" aria-hidden="true"></span>
              <span class="mono" style="color:var(--text-secondary);">${product.soldCount || 42} ordered</span>
            </div>

            <div class="pdp-price-panel">
              <div class="pdp-price-row">
                <span class="pdp-price">${window.SuotStore.formatPrice(product.price)}</span>
                <span class="pdp-stock-signal ${isOutOfStock || isLowStock ? "is-low" : ""}">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    ${isOutOfStock || isLowStock ? `<circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>` : `<polyline points="20 6 9 17 4 12"></polyline>`}
                  </svg>
                  ${
                    isOutOfStock
                      ? "Sold Out — Similar options available below"
                      : isLowStock
                      ? `Only ${availStock} left in Philippine stock${inBagQty ? ` (${inBagQty} in bag)` : ""}`
                      : `Ready for Immediate Dispatch (${availStock} left${inBagQty ? ` · ${inBagQty} in bag` : ""})`
                  }
                </span>
              </div>

              <div class="pdp-shipping-meter">
                <div class="pdp-shipping-text">${shipMeta.text}</div>
                <div class="pdp-shipping-track" aria-hidden="true">
                  <div class="pdp-shipping-fill ${shipMeta.isFree ? "is-free" : ""}" style="width:${shipMeta.pct}%;"></div>
                </div>
              </div>
            </div>

            <p class="pdp-description">${product.description}</p>

            <form id="pdp-add-form" onsubmit="return false;">
              <input type="hidden" name="product_id" value="${product.id}" />
              <input type="hidden" name="color" value="${chosenColor}" />
              <input type="hidden" name="size" value="${chosenSize}" />

              <div class="variant-selector-block">
                <div class="variant-head-row">
                  <label>
                    1. Select Colorway:
                    <span class="variant-selected-name">${chosenColor}</span>
                  </label>
                  <span class="mono" style="color:var(--text-muted);">${product.colors.length} colorways</span>
                </div>
                <div class="pdp-swatch-pills" role="group" aria-label="Colorway options">
                  ${product.colors
                    .map(
                      (c) => `
                      <button
                        type="button"
                        class="pdp-swatch-pill ${c === chosenColor ? "active" : ""}"
                        data-pdp-color="${c}"
                        aria-pressed="${c === chosenColor ? "true" : "false"}"
                      >
                        <span class="pdp-swatch-dot" style="background-color:${window.SuotStore.getColorHex(c)};"></span>
                        <span>${c}</span>
                      </button>
                    `
                    )
                    .join("")}
                </div>
              </div>

              <div class="variant-selector-block">
                <div class="variant-head-row">
                  <label>
                    2. Select Size / Spec:
                    <span class="variant-selected-name">${chosenSize}</span>
                  </label>
                  <button
                    type="button"
                    class="pdp-size-guide-btn"
                    id="pdp-size-guide-toggle"
                    aria-expanded="${sizeGuideOpen ? "true" : "false"}"
                  >
                    ${sizeGuideOpen ? "Hide Size & Fit Guide" : "Size & Fit Guide"}
                  </button>
                </div>

                <div class="size-chip-grid" role="group" aria-label="Size options">
                  ${product.sizes
                    .map(
                      (sz) => `
                      <button
                        type="button"
                        class="size-chip ${sz === chosenSize ? "active" : ""}"
                        data-pdp-size="${sz}"
                        aria-pressed="${sz === chosenSize ? "true" : "false"}"
                      >${sz}</button>
                    `
                    )
                    .join("")}
                </div>

                ${
                  sizeGuideOpen
                    ? `
                  <div class="pdp-size-guide-panel" role="region" aria-label="Size and Fit Measurements">
                    <div class="pdp-size-guide-head">
                      <strong>${guide.title}</strong>
                      <span class="mono" style="color:var(--color-lagoon);">${product.series} Block</span>
                    </div>
                    <table class="pdp-size-table">
                      <thead>
                        <tr>${guide.headers.map((h) => `<th>${h}</th>`).join("")}</tr>
                      </thead>
                      <tbody>
                        ${guide.rows
                          .map(
                            (row) => `<tr>${row.map((cell, idx) => `<td class="${idx === 0 ? "mono" : ""}" style="${idx === 0 ? "font-weight:700;" : ""}">${cell}</td>`).join("")}</tr>`
                          )
                          .join("")}
                      </tbody>
                    </table>
                    <p class="pdp-size-fit-note">${guide.note}</p>
                  </div>
                `
                    : ""
                }
              </div>

              <div class="qty-action-row">
                <div class="qty-stepper" aria-label="Quantity">
                  <button type="button" id="pdp-qty-dec" aria-label="Decrease quantity" ${isOutOfStock || remainingAddable <= 0 || chosenQty <= 1 ? "disabled" : ""}>−</button>
                  <input type="number" name="quantity" id="pdp-qty-input" value="${chosenQty}" min="1" max="${Math.max(1, remainingAddable)}" readonly aria-label="Quantity" />
                  <button type="button" id="pdp-qty-inc" aria-label="Increase quantity" ${isOutOfStock || remainingAddable <= 0 || chosenQty >= remainingAddable ? "disabled" : ""}>+</button>
                </div>

                <button type="button" class="btn btn-primary btn-lg" id="pdp-add-btn" style="flex:1;" ${isOutOfStock || remainingAddable <= 0 ? "disabled" : ""}>
                  ${
                    isOutOfStock
                      ? "Sold Out"
                      : remainingAddable <= 0
                      ? `Max Available (${availStock}) in Bag`
                      : `Add to Island Bag — ${window.SuotStore.formatPrice(lineSubtotal)}`
                  }
                </button>

                <button type="button" class="btn btn-coral btn-lg" id="pdp-buy-now-btn" ${isOutOfStock || remainingAddable <= 0 ? "disabled" : ""}>
                  Buy Now
                </button>
              </div>
              ${
                (isOutOfStock || remainingAddable <= 0) && similarInStock.length
                  ? `
                    <div class="stock-recovery-panel" style="margin-top:var(--space-4);">
                      <strong style="display:block;font-size:var(--text-sm);color:#a63418;margin-bottom:8px;">
                        ${isOutOfStock ? "Out of Stock — Try Similar Island Gear In Stock" : `Maximum Warehouse Stock (${availStock}) Reached in Bag — Similar In Stock`}
                      </strong>
                      <div class="stock-alt-grid">
                        ${similarInStock
                          .map((alt) => {
                            const c0 = (alt.colors && alt.colors[0]) || "Sand";
                            return `
                              <div class="stock-alt-card">
                                <div class="stock-alt-thumb">${window.SuotStore.renderProductVisual(alt, c0)}</div>
                                <div style="min-width:0;flex:1;">
                                  <a href="product.html?id=${encodeURIComponent(alt.id)}" style="font-size:var(--text-xs);font-weight:700;color:var(--text-primary);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${alt.name}</a>
                                  <div style="font-size:11px;color:var(--text-muted);">${alt.series} · ${alt.stock} left · ${window.SuotStore.formatPrice(alt.price)}</div>
                                </div>
                                <button type="button" class="btn btn-primary btn-sm" data-pdp-sim-add="${alt.id}">Add Similar →</button>
                              </div>
                            `;
                          })
                          .join("")}
                      </div>
                    </div>
                  `
                  : ""
              }
            </form>

            <div class="pdp-voucher-row">
              <span><strong>Coastal Perks:</strong> Use voucher on ₱1,000+ or ₱2,500+ checkout</span>
              <div style="display:flex;gap:0.4rem;">
                <button type="button" class="pdp-voucher-copy" data-copy-code="ISLA10">ISLA10 · 10% OFF</button>
                <button type="button" class="pdp-voucher-copy" data-copy-code="SURF15">SURF15 · 15% OFF</button>
              </div>
            </div>

            <div class="pdp-accordion">
              <div class="pdp-acc-item ${openAccordions.has("material") ? "is-open" : ""}" data-acc-id="material">
                <button type="button" class="pdp-acc-trigger" aria-expanded="${openAccordions.has("material")}">
                  <span>Material &amp; Coastal Craftsmanship</span>
                  <svg class="pdp-acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="pdp-acc-body">
                  <p style="margin:0;">${product.fabric || "Breathable coastal performance textile."}</p>
                  <dl class="pdp-acc-dl">
                    <dt>Series Origin</dt>
                    <dd>${product.series} Capsule (${seriesMeta ? seriesMeta.swellTag : "Philippine Coast"})</dd>
                    <dt>Category</dt>
                    <dd>${product.category}</dd>
                    <dt>Selected Variant</dt>
                    <dd>${chosenColor} · ${chosenSize}</dd>
                  </dl>
                </div>
              </div>

              <div class="pdp-acc-item ${openAccordions.has("care") ? "is-open" : ""}" data-acc-id="care">
                <button type="button" class="pdp-acc-trigger" aria-expanded="${openAccordions.has("care")}">
                  <span>Saltwater Care Protocol</span>
                  <svg class="pdp-acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="pdp-acc-body">
                  <p style="margin:0;">${product.care || "Rinse in cool fresh water after saltwater exposure and hang dry in coastal shade."}</p>
                </div>
              </div>

              <div class="pdp-acc-item ${openAccordions.has("shipping") ? "is-open" : ""}" data-acc-id="shipping">
                <button type="button" class="pdp-acc-trigger" aria-expanded="${openAccordions.has("shipping")}">
                  <span>Philippine Island Port Delivery</span>
                  <svg class="pdp-acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="pdp-acc-body">
                  <dl class="pdp-acc-dl" style="margin-top:0;">
                    <dt>Metro Manila</dt>
                    <dd>2–4 business days via Island Express</dd>
                    <dt>Luzon / Visayas</dt>
                    <dd>3–5 business days tracked port dispatch</dd>
                    <dt>Island Ports</dt>
                    <dd>4–6 business days (Siargao, Boracay, El Nido)</dd>
                  </dl>
                </div>
              </div>

              <div class="pdp-acc-item ${openAccordions.has("returns") ? "is-open" : ""}" data-acc-id="returns">
                <button type="button" class="pdp-acc-trigger" aria-expanded="${openAccordions.has("returns")}">
                  <span>14-Day Easy Returns &amp; Cancellations</span>
                  <svg class="pdp-acc-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="6 9 12 15 18 9"></polyline>
                  </svg>
                </button>
                <div class="pdp-acc-body">
                  <p style="margin:0;">Unworn items with original tags qualify for instant size exchange, cancellation prior to dispatch, or full refund within 14 days through your <a href="account.html">Customer Orders Dashboard</a>.</p>
                </div>
              </div>
            </div>
          </div>
        `;

        const stageEl = document.getElementById("pdp-stage");
        const stageImg = stageEl ? stageEl.querySelector(".studio-product-img") : null;
        if (stageEl && stageImg) {
          stageEl.addEventListener("mousemove", (e) => {
            if (!isZoomed) return;
            const rect = stageEl.getBoundingClientRect();
            const px = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
            const py = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
            stageImg.style.transformOrigin = `${px.toFixed(1)}% ${py.toFixed(1)}%`;
          });
          stageEl.addEventListener("click", (e) => {
            if (e.target.closest("#pdp-share-btn") || e.target.closest("#pdp-zoom-toggle")) return;
            isZoomed = !isZoomed;
            stageEl.classList.toggle("is-zoomed", isZoomed);
            const zBtn = document.getElementById("pdp-zoom-toggle");
            if (zBtn) zBtn.querySelector("span").textContent = isZoomed ? "Reset" : "Inspect";
          });
        }

        const zoomBtn = document.getElementById("pdp-zoom-toggle");
        if (zoomBtn) {
          zoomBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            isZoomed = !isZoomed;
            renderPDP();
          });
        }

        const shareBtn = document.getElementById("pdp-share-btn");
        if (shareBtn) {
          shareBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const url = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(url).catch(() => {});
            }
            window.SuotUI.toast(`Copied direct link for ${product.name} (${chosenColor})`, "Link Ready");
          });
        }

        mountEl.querySelectorAll("[data-pdp-color]").forEach((btn) => {
          btn.addEventListener("click", () => {
            chosenColor = btn.getAttribute("data-pdp-color");
            isZoomed = false;
            syncColorUrl(chosenColor);
            renderPDP();
          });
        });

        mountEl.querySelectorAll("[data-pdp-size]").forEach((btn) => {
          btn.addEventListener("click", () => {
            chosenSize = btn.getAttribute("data-pdp-size");
            renderPDP();
          });
        });

        const guideToggle = document.getElementById("pdp-size-guide-toggle");
        if (guideToggle) {
          guideToggle.addEventListener("click", () => {
            sizeGuideOpen = !sizeGuideOpen;
            renderPDP();
          });
        }

        mountEl.querySelectorAll("[data-acc-id]").forEach((item) => {
          const trigger = item.querySelector(".pdp-acc-trigger");
          if (trigger) {
            trigger.addEventListener("click", () => {
              const id = item.getAttribute("data-acc-id");
              if (openAccordions.has(id)) openAccordions.delete(id);
              else openAccordions.add(id);
              item.classList.toggle("is-open", openAccordions.has(id));
              trigger.setAttribute("aria-expanded", String(openAccordions.has(id)));
            });
          }
        });

        mountEl.querySelectorAll("[data-copy-code]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const code = btn.getAttribute("data-copy-code");
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(code).catch(() => {});
            }
            window.SuotUI.toast(`Promo code ${code} copied — paste in Bag or Checkout.`, "Voucher Copied");
          });
        });

        document.getElementById("pdp-qty-dec").addEventListener("click", () => {
          chosenQty = Math.max(1, chosenQty - 1);
          renderPDP();
          const btn = document.getElementById("pdp-add-btn");
          if (btn) btn.classList.add("price-pulse");
        });

        document.getElementById("pdp-qty-inc").addEventListener("click", () => {
          const cap = Math.max(1, remainingAddable);
          if (chosenQty >= cap) {
            window.SuotUI.toast(`Only ${availStock} in stock${inBagQty ? ` (${inBagQty} already in your bag)` : ""}.`, "Stock Ceiling Reached");
            return;
          }
          chosenQty = Math.min(cap, chosenQty + 1);
          renderPDP();
          const btn = document.getElementById("pdp-add-btn");
          if (btn) btn.classList.add("price-pulse");
        });

        mountEl.querySelectorAll("[data-pdp-sim-add]").forEach((simBtn) => {
          simBtn.addEventListener("click", () => {
            const simId = simBtn.getAttribute("data-pdp-sim-add");
            const alt = window.SuotStore.getProductById(simId);
            if (!alt) return;
            const res = window.SuotStore.addToCart(alt.id, alt.sizes[0], alt.colors[0], 1);
            if (!res || !res.ok) {
              window.SuotUI.toast((res && res.message) || "Item unavailable.", "Stock Unavailable");
              return;
            }
            window.SuotUI.flashButtonAdded(simBtn, "✓ Added");
            window.SuotUI.animateCartBadge();
            window.SuotUI.toast(`Added similar option ${alt.name} to your Island Bag!`, "Added Similar Item");
          });
        });

        document.getElementById("pdp-add-btn").addEventListener("click", (e) => {
          const addBtn = e.currentTarget;
          suppressPdpStateRender = true;
          const res = window.SuotStore.addToCart(product.id, chosenSize, chosenColor, chosenQty);
          if (!res || !res.ok) {
            suppressPdpStateRender = false;
            window.SuotUI.toast((res && res.message) || "Insufficient stock available.", "Stock Unavailable");
            renderPDP();
            return;
          }
          window.SuotUI.flashButtonAdded(addBtn, `✓ Added ${chosenQty} to Bag`);
          window.SuotUI.animateCartBadge();
          window.SuotUI.toast(`Added ${chosenQty}× ${product.name} (${chosenSize}, ${chosenColor}) to your bag!`, "Added to Bag");
          setTimeout(() => window.SuotUI.openDrawer("cart"), 240);
          setTimeout(() => {
            suppressPdpStateRender = false;
            renderPDP();
          }, 1150);
        });

        document.getElementById("pdp-buy-now-btn").addEventListener("click", () => {
          const res = window.SuotStore.addToCart(product.id, chosenSize, chosenColor, chosenQty);
          if (!res || !res.ok) {
            window.SuotUI.toast((res && res.message) || "Insufficient stock available for instant checkout.", "Stock Unavailable");
            renderPDP();
            return;
          }
          if (!window.SuotStore.getCurrentUser()) {
            window.SuotUI.toast("Added to your guest bag — sign in or create an account to check out.", "Sign In Required");
            window.SuotUI.navigateTo("auth.html?redirect=checkout.html");
            return;
          }
          window.SuotUI.navigateTo("checkout.html");
        });
      }

      function renderSeriesBand() {
        if (!seriesBandMount || !seriesMeta) return;
        const imgSrc = window.SuotStore.withAssetVersion(seriesMeta.image);
        seriesBandMount.innerHTML = `
          <aside class="pdp-series-band" aria-label="${seriesMeta.name} Dispatch Context">
            <img src="${imgSrc}" alt="${seriesMeta.name} coastal location" class="pdp-series-thumb" loading="lazy" />
            <div class="pdp-series-meta">
              <span class="pdp-series-coords">${seriesMeta.coords} · ${seriesMeta.swellTag}</span>
              <h2>Designed for ${seriesMeta.name}</h2>
              <p>${seriesMeta.description}</p>
            </div>
            <a href="catalog.html?series=${encodeURIComponent(seriesMeta.id)}" class="btn btn-outline">
              Explore ${seriesMeta.id} Series →
            </a>
          </aside>
        `;
      }

      // Curate companion pieces: prioritize same series, fill up to 3 items cleanly
      const allProducts = window.SuotStore.getProducts().filter((p) => p.id !== product.id);
      const sameSeries = allProducts.filter((p) => p.series === product.series);
      const differentCategory = allProducts.filter(
        (p) => p.series !== product.series && p.category !== product.category
      );
      const related = [...sameSeries, ...differentCategory].slice(0, 3);

      function renderRelated() {
        relatedEl.innerHTML = related
          .map((p) => {
            const liveProd = window.SuotStore.getProductById(p.id) || p;
            const activeColor = p._relColor || liveProd.colors[0];
            const activeSize = p._relSize || liveProd.sizes[0];
            const avail = Math.max(0, parseInt(liveProd.stock, 10) || 0);
            const inBag = window.SuotStore.getCartQtyForProduct(liveProd.id);
            const rem = Math.max(0, avail - inBag);
            const isOutOfStock = avail <= 0;
            const isLowStock = avail > 0 && avail <= 5;
            const statusText = isOutOfStock ? "Sold Out" : isLowStock ? `Only ${avail} left` : liveProd.badge || "";

            return `
            <article class="product-card">
              <a href="product.html?id=${encodeURIComponent(liveProd.id)}&color=${encodeURIComponent(activeColor)}" class="product-thumb-wrap">
                <div class="product-thumb-badges">
                  <span class="thumb-series-pill">${liveProd.series}</span>
                  ${
                    statusText
                      ? `<span class="thumb-status-pill ${isOutOfStock || isLowStock ? "is-low-stock" : ""}">${statusText}</span>`
                      : ""
                  }
                </div>
                <div class="product-svg-stage">
                  ${window.SuotStore.renderProductVisual(liveProd, activeColor)}
                </div>
                <span class="thumb-quickview-pill">View Details →</span>
              </a>

              <div class="product-body">
                <div class="product-meta-header">
                  <a href="product.html?id=${encodeURIComponent(liveProd.id)}&color=${encodeURIComponent(activeColor)}" class="product-title-link">
                    <h3>${liveProd.name}</h3>
                  </a>
                  <div class="product-price">${window.SuotStore.formatPrice(liveProd.price)}</div>
                </div>

                <div class="swatch-row" aria-label="Color Variants">
                  ${liveProd.colors
                    .map(
                      (c) => `
                      <button
                        type="button"
                        class="color-swatch ${c === activeColor ? "active" : ""}"
                        style="background-color:${window.SuotStore.getColorHex(c)};"
                        title="${c}"
                        data-rel-swatch-prod="${liveProd.id}"
                        data-rel-swatch-val="${c}"
                      ></button>
                    `
                    )
                    .join("")}
                  <span style="font-size:var(--text-xs);color:var(--text-muted);margin-left:2px;">${activeColor}</span>
                </div>

                <div class="card-size-row" aria-label="Quick Size Selection">
                  ${liveProd.sizes
                    .map(
                      (sz) => `
                      <button
                        type="button"
                        class="card-size-pill ${sz === activeSize ? "active" : ""}"
                        data-rel-size-prod="${liveProd.id}"
                        data-rel-size-val="${sz}"
                      >${sz}</button>
                    `
                    )
                    .join("")}
                </div>

                <button type="button" class="btn-minimal-add" data-rel-add="${liveProd.id}" ${isOutOfStock || rem <= 0 ? "disabled" : ""}>
                  ${isOutOfStock ? "Sold Out" : rem <= 0 ? `Max in Bag (${avail})` : `Add to Bag · ${activeSize}`}
                </button>
              </div>
            </article>
          `;
          })
          .join("");

        relatedEl.querySelectorAll("[data-rel-swatch-prod]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const p = related.find((item) => item.id === btn.getAttribute("data-rel-swatch-prod"));
            if (p) {
              p._relColor = btn.getAttribute("data-rel-swatch-val");
              renderRelated();
            }
          });
        });

        relatedEl.querySelectorAll("[data-rel-size-prod]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const p = related.find((item) => item.id === btn.getAttribute("data-rel-size-prod"));
            if (p) {
              p._relSize = btn.getAttribute("data-rel-size-val");
              renderRelated();
            }
          });
        });

        relatedEl.querySelectorAll("[data-rel-add]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const p = related.find((item) => item.id === btn.getAttribute("data-rel-add"));
            if (p) {
              const color = p._relColor || p.colors[0];
              const size = p._relSize || p.sizes[0];
              suppressPdpStateRender = true;
              const res = window.SuotStore.addToCart(p.id, size, color, 1);
              if (!res || !res.ok) {
                suppressPdpStateRender = false;
                window.SuotUI.toast((res && res.message) || "Insufficient stock available.", "Stock Unavailable");
                renderRelated();
                return;
              }
              window.SuotUI.flashButtonAdded(btn, `✓ Added · ${size}`);
              window.SuotUI.animateCartBadge();
              window.SuotUI.toast(`Added ${p.name} (${size}, ${color}) to your Island Bag!`, "Added to Bag");
              setTimeout(() => {
                suppressPdpStateRender = false;
                renderRelated();
              }, 1150);
            }
          });
        });
      }

      let suppressPdpStateRender = false;
      window.addEventListener("suotisla:statechange", () => {
        if (suppressPdpStateRender) return;
        renderPDP();
        renderRelated();
      });

      renderPDP();
      renderSeriesBand();
      renderRelated();
    });
  </script>
</body>
</html>
